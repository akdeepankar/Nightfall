<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <title>NIGHTFALL Controller</title>
        <style>
            :root {
                --bg: #0f1420;
                --panel: #1a2335;
                --line: #334463;
                --text: #e8eeff;
                --muted: #9aabcf;
                --ok: #22c55e;
                --warn: #f59e0b;
                --bad: #ef4444;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                overflow-x: hidden;
                overflow-y: auto;
                background: radial-gradient(
                    900px 500px at 50% -10%,
                    #1c2740 0%,
                    var(--bg) 45%
                );
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Arial, sans-serif;
                -webkit-tap-highlight-color: transparent;
                user-select: none;
                touch-action: manipulation;
            }

            #app {
                min-height: 100vh;
                padding: 10px;
                display: grid;
                gap: 8px;
                grid-template-rows: auto auto auto minmax(220px, 1fr) auto;
            }

            .card {
                background: linear-gradient(180deg, #1d2740 0%, #182238 100%);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 8px;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
            }

            .row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }

            .title {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }

            .sub {
                margin-top: 2px;
                font-size: 11px;
                color: var(--muted);
                line-height: 1.25;
            }

            .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                display: inline-block;
                background: #7b879c;
                margin-right: 6px;
                vertical-align: middle;
            }
            .ok {
                background: var(--ok);
                box-shadow: 0 0 8px rgba(34, 197, 94, 0.7);
            }
            .warn {
                background: var(--warn);
                box-shadow: 0 0 8px rgba(245, 158, 11, 0.7);
            }
            .bad {
                background: var(--bad);
                box-shadow: 0 0 8px rgba(239, 68, 68, 0.7);
            }

            button {
                border: 1px solid #4d638e;
                background: #2a3b5f;
                color: #fff;
                border-radius: 8px;
                padding: 8px 10px;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }
            button:active {
                transform: scale(0.97);
            }

            .btn-warn {
                background: linear-gradient(180deg, #f5b348, #d88a16);
                border-color: #ffc36d;
                color: #1a1300;
            }

            .btn-ghost {
                background: #1f2c46;
                border-color: #36496f;
                color: #d4def7;
            }

            #triple {
                display: grid;
                grid-template-columns: 1fr auto auto;
                gap: 8px;
                align-items: center;
            }

            #ammo {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                min-height: 12px;
            }
            .ammo-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #fde047;
                box-shadow: 0 0 8px rgba(253, 224, 71, 0.6);
            }
            .ammo-dot.spent {
                background: #3a4a68;
                box-shadow: none;
            }

            #bar {
                height: 8px;
                background: #0f172a;
                border: 1px solid #334463;
                border-radius: 999px;
                overflow: hidden;
                margin-top: 6px;
            }
            #fill {
                height: 100%;
                width: 0%;
                background: linear-gradient(90deg, #ef4444, #f59e0b, #fde047);
                transition: width 0.08s linear;
            }

            #main {
                min-height: 0;
                display: grid;
                gap: 8px;
                grid-template-rows: auto auto auto;
            }

            #fire {
                width: 100%;
                height: auto;
                min-height: 80px;
                border-radius: 14px;
                border: 1px solid #9f2a34;
                background:
                    radial-gradient(
                        120% 120% at 50% 20%,
                        rgba(255, 170, 170, 0.2),
                        rgba(255, 170, 170, 0) 40%
                    ),
                    radial-gradient(
                        160% 120% at 50% 100%,
                        #9d121b 0%,
                        #5d080e 45%,
                        #180204 100%
                    );
                box-shadow:
                    inset 0 0 55px rgba(0, 0, 0, 0.45),
                    0 10px 22px rgba(0, 0, 0, 0.38);
                font-size: clamp(26px, 9vw, 42px);
                letter-spacing: 0.12em;
                font-weight: 900;
                text-transform: uppercase;
            }

            #bottom {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 8px;
            }

            #flash {
                position: fixed;
                inset: 0;
                pointer-events: none;
                opacity: 0;
                background: rgba(255, 120, 80, 0.26);
            }
            #flash.show {
                animation: flashOut 0.14s ease-out;
            }
            @keyframes flashOut {
                0% {
                    opacity: 1;
                }
                100% {
                    opacity: 0;
                }
            }

            #toast {
                position: fixed;
                left: 50%;
                bottom: 12px;
                transform: translateX(-50%);
                background: rgba(20, 26, 38, 0.95);
                border: 1px solid var(--line);
                color: #dbe4ff;
                border-radius: 8px;
                padding: 8px 10px;
                font-size: 12px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.16s ease;
            }
            #toast.show {
                opacity: 1;
            }

            /* Compact phone screens: keep controls fully visible */
            @media (max-height: 760px) {
                #app {
                    padding: 6px;
                    gap: 5px;
                }

                .card {
                    padding: 6px;
                }

                .title {
                    font-size: 10px;
                    letter-spacing: 0.08em;
                }

                .sub {
                    font-size: 10px;
                    line-height: 1.15;
                }

                #main {
                    grid-template-rows: auto auto;
                }

                /* Hide shake meter card on very short screens */
                #main .card:nth-child(2) {
                    display: none;
                }

                #fire {
                    min-height: 120px;
                    font-size: clamp(22px, 8vw, 34px);
                    letter-spacing: 0.1em;
                }

                #bottom {
                    gap: 6px;
                }

                button {
                    padding: 7px 8px;
                    font-size: 10px;
                }
            }

            @media (max-height: 640px) {
                #app {
                    grid-template-rows: auto auto 1fr auto;
                }

                /* Hide link row to prioritize core controls */
                #app > .card:nth-child(2) {
                    display: none;
                }

                #fire {
                    min-height: 96px;
                }
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div class="card">
                <div class="row">
                    <div class="title">Controller</div>
                    <div>
                        <span id="wsDot" class="dot warn"></span>
                        <span
                            id="wsTxt"
                            style="font-size: 11px; color: var(--muted)"
                            >Connecting</span
                        >
                    </div>
                </div>
                <div id="host" class="sub">Server: …</div>
            </div>

            <div class="card" id="triple">
                <div>
                    <div class="title">Link</div>
                    <div id="linkSub" class="sub">Offline</div>
                </div>
                <div>
                    <span id="ctrlDot" class="dot bad"></span>
                    <span
                        id="ctrlTxt"
                        style="font-size: 11px; color: var(--muted)"
                        >Off</span
                    >
                </div>
                <button id="reconnect" class="btn-ghost">Reconnect</button>
            </div>

            <div class="card" id="triple">
                <div>
                    <div class="title">Motion</div>
                    <div id="sensorSub" class="sub">Tap Enable</div>
                </div>
                <div>
                    <span id="sensorDot" class="dot warn"></span>
                    <span
                        id="sensorTxt"
                        style="font-size: 11px; color: var(--muted)"
                        >Off</span
                    >
                </div>
                <button id="enable">Enable Motion</button>
            </div>

            <div id="main">
                <div class="card row">
                    <div id="ammo"></div>
                    <div
                        style="
                            font-size: 11px;
                            color: var(--muted);
                            letter-spacing: 0.07em;
                            text-transform: uppercase;
                        "
                    >
                        Point to Move
                    </div>
                </div>

                <div class="card" id="movepad">
                    <div style="text-align: center; font-size: 11px; color: var(--muted); margin-bottom: 8px;">
                        Movement Pad
                    </div>
                    <div id="movepadCanvas" style="width: 100%; aspect-ratio: 1 / 1; background: radial-gradient(circle at 50% 50%, #2a4070 0%, #0f1420 100%); border: 1px solid #334463; border-radius: 8px; position: relative; cursor: crosshair; touch-action: none;"></div>
                </div>

                <button id="fire" aria-label="Fire">Fire</button>
            </div>

            <div id="bottom">
                <button id="start" class="btn-ghost">Start Game</button>
                <button id="reload" class="btn-warn">Reload</button>
                <button id="cal">Calibrate</button>
            </div>
        </div>

        <div id="flash"></div>
        <div id="toast"></div>

        <script>
            const el = (id) => document.getElementById(id);

            const wsDot = el("wsDot");
            const wsTxt = el("wsTxt");
            const ctrlDot = el("ctrlDot");
            const ctrlTxt = el("ctrlTxt");
            const linkSub = el("linkSub");
            const sensorDot = el("sensorDot");
            const sensorTxt = el("sensorTxt");
            const sensorSub = el("sensorSub");
            const host = el("host");
            const fill = el("fill");
            const pct = el("pct");
            const sensorCounts = el("sensorCounts");
            const fire = el("fire");
            const toast = el("toast");

            let ws = null;
            let ready = false;
            let retry = null;
            let retries = 0;

            let cool = false;
            let lastSend = 0;

            const send = (o) => {
                if (ws && ws.readyState === 1) ws.send(JSON.stringify(o));
            };

            const setDot = (d, c) => (d.className = "dot " + c);

            function showToast(msg, ms = 1600) {
                toast.textContent = msg;
                toast.classList.add("show");
                clearTimeout(showToast._t);
                showToast._t = setTimeout(
                    () => toast.classList.remove("show"),
                    ms,
                );
            }

            function renderAmmo(cur = 10, max = 10) {
                const a = el("ammo");
                a.innerHTML = "";
                for (let i = 0; i < max; i++) {
                    const s = document.createElement("span");
                    s.className = "ammo-dot" + (i < cur ? "" : " spent");
                    a.appendChild(s);
                }
            }

            function wsURL() {
                return (
                    (location.protocol === "https:" ? "wss://" : "ws://") +
                    location.host
                );
            }

            function scheduleReconnect() {
                retries += 1;
                const delay = Math.min(1200 + retries * 800, 6000);
                clearTimeout(retry);
                retry = setTimeout(connect, delay);
            }

            function connect() {
                clearTimeout(retry);
                setDot(wsDot, "warn");
                wsTxt.textContent = "Connecting";
                setDot(ctrlDot, "bad");
                ctrlTxt.textContent = "No Link";
                linkSub.textContent = "Offline";
                host.textContent = "Server: " + location.origin;

                try {
                    ws = new WebSocket(wsURL());
                } catch {
                    scheduleReconnect();
                    return;
                }

                ws.onopen = () => {
                    ready = true;
                    retries = 0;
                    setDot(wsDot, "ok");
                    wsTxt.textContent = "Connected";
                    setDot(ctrlDot, "ok");
                    ctrlTxt.textContent = "On";
                    linkSub.textContent = "Live";
                    send({ type: "register", role: "controller" });
                    showToast("Controller connected");
                };

                ws.onmessage = (e) => {
                    let m;
                    try {
                        m = JSON.parse(e.data);
                    } catch {
                        return;
                    }
                    if (m.type === "ammoSync") renderAmmo(m.ammo, m.maxAmmo);
                    if (m.type === "serverInfo")
                        host.textContent =
                            "Game server: http://" + m.ip + ":" + m.port;
                };

                ws.onerror = () => {
                    setDot(wsDot, "bad");
                    wsTxt.textContent = "Error";
                };

                ws.onclose = () => {
                    ready = false;
                    setDot(wsDot, "warn");
                    wsTxt.textContent = "Reconnecting";
                    scheduleReconnect();
                };
            }

            function pulseFlash() {
                const fx = el("flash");
                fx.classList.remove("show");
                void fx.offsetWidth;
                fx.classList.add("show");
            }

            function fireNow(fromShake) {
                if (cool) return;
                cool = true;
                setTimeout(() => (cool = false), 300);

                send({ type: "fire" });
                pulseFlash();

                fire.style.transform = "scale(0.97)";
                setTimeout(() => (fire.style.transform = ""), 120);

                if (navigator.vibrate) navigator.vibrate(20);

                if (fromShake) {
                    fire.textContent = "Fired";
                    setTimeout(() => (fire.textContent = "Fire"), 320);
                }
            }

            let motionEventSeen = false;
            let orientationEventSeen = false;
            let enableCheckTimer = null;

            // ─── Movement Pad Variables ────────────────────────────────────────
            let movepadElement = null;
            let currentTouchId = null;
            let lastMoveSend = 0;
            const MOVE_SEND_MS = 28; // throttle movement updates

            function setupMovePad() {
                movepadElement = el("movepadCanvas");
                if (!movepadElement) return;

                // Touch events
                movepadElement.addEventListener("touchstart", onMovepadTouchStart, { passive: false });
                movepadElement.addEventListener("touchmove", onMovepadTouchMove, { passive: false });
                movepadElement.addEventListener("touchend", onMovepadTouchEnd, { passive: false });

                // Mouse events (for desktop testing)
                movepadElement.addEventListener("mousedown", onMovepadMouseDown);
                movepadElement.addEventListener("mousemove", onMovepadMouseMove);
                movepadElement.addEventListener("mouseup", onMovepadMouseUp);
                movepadElement.addEventListener("mouseleave", onMovepadMouseUp);
            }

            function getMovepadCenter() {
                if (!movepadElement) return { x: 0, y: 0 };
                const rect = movepadElement.getBoundingClientRect();
                return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            }

            function calculateMovementDirection(x, y) {
                const center = getMovepadCenter();
                const rect = movepadElement.getBoundingClientRect();
                const dx = x - center.x;
                const dy = y - center.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                // Normalize to 360 degrees (atan2 returns -PI to PI)
                let angle = Math.atan2(dy, dx);
                // Convert to 0-360 degrees (0 = right, 90 = down, 180 = left, 270 = up)
                angle = (angle * 180) / Math.PI;
                if (angle < 0) angle += 360;
                
                // Clamped magnitude (0-1)
                const radius = Math.min(rect.width, rect.height) / 2;
                const magnitude = Math.max(0, Math.min(1, dist / radius));
                
                return { angle, magnitude, dx, dy, dist };
            }

            function sendMovement(angle, magnitude) {
                if (!ready) return;
                const now = performance.now();
                if (now - lastMoveSend < MOVE_SEND_MS) return;
                lastMoveSend = now;

                // Only send if there's actual movement (deadzone: magnitude > 0.05)
                if (magnitude < 0.05) {
                    send({ type: "move", angle: 0, magnitude: 0 });
                    return;
                }

                send({ type: "move", angle, magnitude });
            }

            function onMovepadMouseDown(e) {
                currentTouchId = "mouse";
                const movement = calculateMovementDirection(e.clientX, e.clientY);
                sendMovement(movement.angle, movement.magnitude);
            }

            function onMovepadMouseMove(e) {
                if (currentTouchId !== "mouse") return;
                const movement = calculateMovementDirection(e.clientX, e.clientY);
                sendMovement(movement.angle, movement.magnitude);
            }

            function onMovepadMouseUp() {
                if (currentTouchId === "mouse") {
                    currentTouchId = null;
                    sendMovement(0, 0);
                }
            }

            function onMovepadTouchStart(e) {
                e.preventDefault();
                if (e.touches.length === 0) return;
                currentTouchId = e.touches[0].identifier;
                const touch = e.touches[0];
                const movement = calculateMovementDirection(touch.clientX, touch.clientY);
                sendMovement(movement.angle, movement.magnitude);
            }

            function onMovepadTouchMove(e) {
                e.preventDefault();
                if (e.touches.length === 0) return;
                
                let activeTouch = null;
                for (let touch of e.touches) {
                    if (touch.identifier === currentTouchId) {
                        activeTouch = touch;
                        break;
                    }
                }
                
                if (!activeTouch) return;
                const movement = calculateMovementDirection(activeTouch.clientX, activeTouch.clientY);
                sendMovement(movement.angle, movement.magnitude);
            }

            function onMovepadTouchEnd(e) {
                e.preventDefault();
                let stillHasTouch = false;
                for (let touch of e.touches) {
                    if (touch.identifier === currentTouchId) {
                        stillHasTouch = true;
                        break;
                    }
                }
                
                if (!stillHasTouch) {
                    currentTouchId = null;
                    sendMovement(0, 0);
                }
            }

            el("reconnect").onclick = () => {
                try {
                    if (ws) ws.close();
                } catch {}
                connect();
                showToast("Reconnect requested");
            };

            el("enable").onclick = async () => {
                showToast("Movement pad ready!");
            };
            el("start").onclick = () => {
                send({ type: "start" });
                showToast("Start Game sent");
            };
            el("reload").onclick = () => {
                send({ type: "reload" });
                showToast("Reload sent");
            };
            el("cal").onclick = () => {
                showToast("Calibration not needed");
            };

            fire.addEventListener(
                "touchstart",
                (e) => {
                    e.preventDefault();
                    fireNow(false);
                },
                { passive: false },
            );
            fire.addEventListener("mousedown", (e) => {
                e.preventDefault();
                fireNow(false);
            });

            renderAmmo(10, 10);
            setupMovePad();
            connect();
            setInterval(() => send({ type: "ping", t: Date.now() }), 12000);
        </script>
    </body>
</html>
