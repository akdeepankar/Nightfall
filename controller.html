<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <title>NIGHTFALL Controller</title>
        <style>
            :root {
                --bg: #0f1420;
                --panel: #1a2335;
                --line: #334463;
                --text: #e8eeff;
                --muted: #9aabcf;
                --ok: #22c55e;
                --warn: #f59e0b;
                --bad: #ef4444;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                overflow-x: hidden;
                overflow-y: auto;
                background: radial-gradient(
                    900px 500px at 50% -10%,
                    #1c2740 0%,
                    var(--bg) 45%
                );
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Arial, sans-serif;
                -webkit-tap-highlight-color: transparent;
                user-select: none;
                touch-action: manipulation;
            }

            #app {
                min-height: 100vh;
                padding: 10px;
                display: grid;
                gap: 8px;
                grid-template-rows: auto auto auto minmax(220px, 1fr) auto;
            }

            .card {
                background: linear-gradient(180deg, #1d2740 0%, #182238 100%);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 8px;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
            }

            .row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }

            .title {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }

            .sub {
                margin-top: 2px;
                font-size: 11px;
                color: var(--muted);
                line-height: 1.25;
            }

            .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                display: inline-block;
                background: #7b879c;
                margin-right: 6px;
                vertical-align: middle;
            }
            .ok {
                background: var(--ok);
                box-shadow: 0 0 8px rgba(34, 197, 94, 0.7);
            }
            .warn {
                background: var(--warn);
                box-shadow: 0 0 8px rgba(245, 158, 11, 0.7);
            }
            .bad {
                background: var(--bad);
                box-shadow: 0 0 8px rgba(239, 68, 68, 0.7);
            }

            button {
                border: 1px solid #4d638e;
                background: #2a3b5f;
                color: #fff;
                border-radius: 8px;
                padding: 8px 10px;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }
            button:active {
                transform: scale(0.97);
            }

            .btn-warn {
                background: linear-gradient(180deg, #f5b348, #d88a16);
                border-color: #ffc36d;
                color: #1a1300;
            }

            .btn-ghost {
                background: #1f2c46;
                border-color: #36496f;
                color: #d4def7;
            }

            #triple {
                display: grid;
                grid-template-columns: 1fr auto auto;
                gap: 8px;
                align-items: center;
            }

            #ammo {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                min-height: 12px;
            }
            .ammo-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #fde047;
                box-shadow: 0 0 8px rgba(253, 224, 71, 0.6);
            }
            #bar {
                height: 8px;
                background: #0f172a;
                border: 1px solid #334463;
                border-radius: 999px;
                overflow: hidden;
                margin-top: 6px;
            }
            #fill {
                height: 100%;
                width: 0%;
                background: linear-gradient(90deg, #ef4444, #f59e0b, #fde047);
                transition: width 0.08s linear;
            }

            #main {
                min-height: 0;
                display: grid;
                gap: 8px;
                grid-template-rows: auto auto auto auto;
            }

            #fire {
                width: 100%;
                height: auto;
                min-height: 90px;
                border-radius: 14px;
                border: 1px solid #9f2a34;
                background:
                    radial-gradient(
                        120% 120% at 50% 20%,
                        rgba(255, 170, 170, 0.2),
                        rgba(255, 170, 170, 0) 40%
                    ),
                    radial-gradient(
                        160% 120% at 50% 100%,
                        #9d121b 0%,
                        #5d080e 45%,
                        #180204 100%
                    );
                box-shadow:
                    inset 0 0 55px rgba(0, 0, 0, 0.45),
                    0 10px 22px rgba(0, 0, 0, 0.38);
                font-size: clamp(26px, 9vw, 42px);
                letter-spacing: 0.12em;
                font-weight: 900;
                text-transform: uppercase;
            }

            #bottom {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 8px;
            }

            #flash {
                position: fixed;
                inset: 0;
                pointer-events: none;
                opacity: 0;
                background: rgba(255, 120, 80, 0.26);
            }
            #flash.show {
                animation: flashOut 0.14s ease-out;
            }
            @keyframes flashOut {
                0% {
                    opacity: 1;
                }
                100% {
                    opacity: 0;
                }
            }

            #toast {
                position: fixed;
                left: 50%;
                bottom: 12px;
                transform: translateX(-50%);
                background: rgba(20, 26, 38, 0.95);
                border: 1px solid var(--line);
                color: #dbe4ff;
                border-radius: 8px;
                padding: 8px 10px;
                font-size: 12px;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.16s ease;
            }
            #toast.show {
                opacity: 1;
            }

            /* Compact phone screens: keep controls fully visible */
            @media (max-height: 760px) {
                #app {
                    padding: 6px;
                    gap: 5px;
                }

                .card {
                    padding: 6px;
                }

                .title {
                    font-size: 10px;
                    letter-spacing: 0.08em;
                }

                .sub {
                    font-size: 10px;
                    line-height: 1.15;
                }

                #main {
                    grid-template-rows: auto auto auto;
                }

                /* Hide shake meter card on very short screens */
                #main .card:nth-child(2) {
                    display: none;
                }

                #fire {
                    min-height: 120px;
                    font-size: clamp(22px, 8vw, 34px);
                    letter-spacing: 0.1em;
                }

                #bottom {
                    gap: 6px;
                }

                button {
                    padding: 7px 8px;
                    font-size: 10px;
                }
            }

            @media (max-height: 640px) {
                #app {
                    grid-template-rows: auto auto 1fr auto;
                }

                /* Hide link row to prioritize core controls */
                #app > .card:nth-child(2) {
                    display: none;
                }

                /* Hide movement on very short screens */
                #main .card:nth-child(3) {
                    display: none;
                }

                #fire {
                    min-height: 96px;
                }
            }
        </style>
    </head>
    <body>
        <div id="app">
            <!-- Minimal Status Bar -->
            <div id="status-bar">
                <div class="status-item">
                    <span id="wsDot" class="dot warn"></span>
                    <span id="wsTxt">WS</span>
                </div>
                <div class="status-item">
                    <span id="ctrlDot" class="dot bad"></span>
                    <span id="ctrlTxt">LINK</span>
                </div>
                <div class="status-item">
                    <span id="sensorDot" class="dot warn"></span>
                    <span id="sensorTxt">MOTION</span>
                </div>
                <div id="host" style="display: none;"></div>
            </div>

            <!-- Ammo Indicator -->
            <div id="ammo-container">
                <div id="ammo"></div>
            </div>

            <!-- Main Control Area -->
            <div id="controls">
                <button id="fire" aria-label="Fire">FIRE</button>
                
                <!-- Hidden/Optional Info -->
                <div id="motion-overlay">
                    <div id="sensorSub" style="display: none;"></div>
                    <div id="sensorCounts" style="display: none;"></div>
                    <div id="pct" style="display: none;">0%</div>
                    <div id="bar" style="visibility: hidden;"><div id="fill"></div></div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div id="actions">
                <button id="enable">ENABLE MOTION</button>
                <button id="start" class="btn-ghost">START</button>
                <button id="reload" class="btn-warn">RELOAD</button>
                <button id="cal">CAL</button>
            </div>
        </div>

        <style>
            :root {
                --bg: #05070a;
                --accent: #ff3e3e;
                --text: #ffffff;
                --muted: rgba(255, 255, 255, 0.4);
            }

            * { box-sizing: border-box; margin: 0; padding: 0; }
            html, body {
                width: 100%; height: 100%; overflow: hidden;
                background: var(--bg);
                color: var(--text);
                font-family: -apple-system, system-ui, sans-serif;
                user-select: none; touch-action: none;
            }

            #app {
                height: 100%;
                display: flex;
                flex-direction: column;
                padding: 20px;
                gap: 20px;
            }

            #status-bar {
                display: flex;
                justify-content: center;
                gap: 20px;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.1em;
                color: var(--muted);
            }

            .status-item { display: flex; align-items: center; gap: 6px; }
            .dot { width: 6px; height: 6px; border-radius: 50%; background: #444; }
            .dot.ok { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
            .dot.warn { background: #ffaa00; box-shadow: 0 0 8px #ffaa00; }
            .dot.bad { background: #ff3e3e; box-shadow: 0 0 8px #ff3e3e; }

            #ammo-container {
                display: flex;
                justify-content: center;
            }
            #ammo {
                display: flex;
                gap: 8px;
            }
            .ammo-dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #fde047;
                transition: opacity 0.2s, transform 0.2s;
            }
            .ammo-dot.spent {
                opacity: 0.15;
                transform: scale(0.8);
            }

            #controls {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            #fire {
                width: 100%;
                height: 60vh;
                background: linear-gradient(135deg, #1a0505 0%, #3a0a0a 100%);
                border: 2px solid #5a1a1a;
                border-radius: 24px;
                color: #fff;
                font-size: 48px;
                font-weight: 900;
                letter-spacing: 0.2em;
                box-shadow: 0 20px 40px rgba(0,0,0,0.5);
                transition: transform 0.1s, background 0.1s;
                -webkit-tap-highlight-color: transparent;
            }
            #fire:active {
                transform: scale(0.98);
                background: #5a1a1a;
            }

            #actions {
                display: grid;
                grid-template-columns: 2fr 1fr 1.5fr 1fr;
                gap: 10px;
            }

            #actions button {
                padding: 15px 5px;
                border-radius: 12px;
                border: 1px solid rgba(255,255,255,0.1);
                background: rgba(255,255,255,0.05);
                color: #fff;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.05em;
                text-transform: uppercase;
            }

            #actions .btn-warn { background: #ffaa00; color: #000; border: none; }
            #actions .btn-ghost { background: rgba(0, 255, 136, 0.1); border-color: rgba(0, 255, 136, 0.3); color: #00ff88; }

            #flash {
                position: fixed; inset: 0; pointer-events: none; opacity: 0;
                background: #fff; z-index: 100;
            }
            #flash.show { animation: flashOut 0.15s ease-out; }
            @keyframes flashOut { 0% { opacity: 0.4; } 100% { opacity: 0; } }

            #toast {
                position: fixed; left: 50%; top: 20px; transform: translateX(-50%);
                background: rgba(255,255,255,0.9); color: #000;
                padding: 10px 20px; border-radius: 20px; font-size: 12px; font-weight: 700;
                opacity: 0; transition: opacity 0.2s, transform 0.2s;
                z-index: 200; pointer-events: none;
            }
            #toast.show { opacity: 1; transform: translate(-50%, 10px); }
        </style>


        <script>
            const el = (id) => document.getElementById(id);

            const wsDot = el("wsDot");
            const wsTxt = el("wsTxt");
            const ctrlDot = el("ctrlDot");
            const ctrlTxt = el("ctrlTxt");
            const linkSub = el("linkSub");
            const sensorDot = el("sensorDot");
            const sensorTxt = el("sensorTxt");
            const sensorSub = el("sensorSub");
            const host = el("host");
            const fill = el("fill");
            const pct = el("pct");
            const sensorCounts = el("sensorCounts");
            const fire = el("fire");
            const toast = el("toast");

            let ws = null;
            let ready = false;
            let retry = null;
            let retries = 0;

            let cool = false;
            let lastSend = 0;
            let lastShake = 0,
                ax = 0,
                ay = 0,
                az = 0;

            // Drift-free motion look uses acceleration deltas (jerk), not absolute baseline.
            let smoothDX = 0,
                smoothDY = 0;

            let motionEventCount = 0;
            let orientationEventCount = 0;

            const SHAKE = 8.5;
            const SHAKECD = 260;
            const LOOKMS = 12;
            const LOOKS = 6.0;
            const MOTION_DEADZONE = 0.12;
            const MOTION_SMOOTH = 0.2;

            const send = (o) => {
                if (ws && ws.readyState === 1) ws.send(JSON.stringify(o));
            };

            const setDot = (d, c) => (d.className = "dot " + c);

            function showToast(msg, ms = 1600) {
                toast.textContent = msg;
                toast.classList.add("show");
                clearTimeout(showToast._t);
                showToast._t = setTimeout(
                    () => toast.classList.remove("show"),
                    ms,
                );
            }

            function renderAmmo(cur = 10, max = 10) {
                const a = el("ammo");
                a.innerHTML = "";
                for (let i = 0; i < max; i++) {
                    const s = document.createElement("span");
                    s.className = "ammo-dot" + (i < cur ? "" : " spent");
                    a.appendChild(s);
                }
            }

            function wsURL() {
                return (
                    (location.protocol === "https:" ? "wss://" : "ws://") +
                    location.host
                );
            }

            function scheduleReconnect() {
                retries += 1;
                const delay = Math.min(1200 + retries * 800, 6000);
                clearTimeout(retry);
                retry = setTimeout(connect, delay);
            }

            function connect() {
                clearTimeout(retry);
                setDot(wsDot, "warn");
                wsTxt.textContent = "Connecting";
                setDot(ctrlDot, "bad");
                ctrlTxt.textContent = "No Link";
                linkSub.textContent = "Offline";
                host.textContent = "Server: " + location.origin;

                try {
                    ws = new WebSocket(wsURL());
                } catch {
                    scheduleReconnect();
                    return;
                }

                ws.onopen = () => {
                    ready = true;
                    retries = 0;
                    setDot(wsDot, "ok");
                    wsTxt.textContent = "Connected";
                    setDot(ctrlDot, "ok");
                    ctrlTxt.textContent = "On";
                    linkSub.textContent = "Live";
                    send({ type: "register", role: "controller" });
                    showToast("Controller connected");
                };

                ws.onmessage = (e) => {
                    let m;
                    try {
                        m = JSON.parse(e.data);
                    } catch {
                        return;
                    }
                    if (m.type === "ammoSync") renderAmmo(m.ammo, m.maxAmmo);
                    if (m.type === "serverInfo")
                        host.textContent =
                            "Game server: http://" + m.ip + ":" + m.port;
                };

                ws.onerror = () => {
                    setDot(wsDot, "bad");
                    wsTxt.textContent = "Error";
                };

                ws.onclose = () => {
                    ready = false;
                    setDot(wsDot, "warn");
                    wsTxt.textContent = "Reconnecting";
                    scheduleReconnect();
                };
            }

            function pulseFlash() {
                const fx = el("flash");
                fx.classList.remove("show");
                void fx.offsetWidth;
                fx.classList.add("show");
            }

            function fireNow(fromShake) {
                if (cool) return;
                cool = true;
                setTimeout(() => (cool = false), 300);

                send({ type: "fire" });
                pulseFlash();

                fire.style.transform = "scale(0.97)";
                setTimeout(() => (fire.style.transform = ""), 120);

                if (navigator.vibrate) navigator.vibrate(20);

                if (fromShake) {
                    fire.textContent = "Fired";
                    setTimeout(() => (fire.textContent = "Fire"), 320);
                }
            }

            let motionEventSeen = false;
            let orientationEventSeen = false;
            let enableCheckTimer = null;
            let lastOrientationAlpha = null;
            let lastOrientationBeta = null;
            let lastOrientationGamma = null;

            function onMotion(e) {
                motionEventSeen = true;
                motionEventCount++;
                if (sensorCounts)
                    sensorCounts.textContent =
                        "M: " +
                        motionEventCount +
                        " • O: " +
                        orientationEventCount;

                // Use accelerationIncludingGravity for broad support.
                const source =
                    e.accelerationIncludingGravity &&
                    typeof e.accelerationIncludingGravity.x === "number"
                        ? e.accelerationIncludingGravity
                        : e.acceleration && typeof e.acceleration.x === "number"
                          ? e.acceleration
                          : null;

                if (!source) return;

                const x = source.x || 0,
                    y = source.y || 0,
                    z = source.z || 0;

                // Keep shake-to-fire using derivative magnitude.
                const dx = x - ax,
                    dy = y - ay,
                    dz = z - az;
                ax = x;
                ay = y;
                az = z;

                const mag = Math.sqrt(dx * dx + dy * dy + dz * dz);
                const p = Math.max(0, Math.min(100, (mag / SHAKE) * 100));
                fill.style.width = p.toFixed(0) + "%";
                pct.textContent = p.toFixed(0) + "%";

                const now = Date.now();
                if (mag > SHAKE && now - lastShake > SHAKECD) {
                    lastShake = now;
                    fireNow(true);
                }
            }

            function sendLook(yawDelta, pitchDelta) {
                if (!ready) return;
                const now = performance.now();
                if (now - lastSend < LOOKMS) return;
                lastSend = now;
                if (Math.abs(yawDelta) < 0.01 && Math.abs(pitchDelta) < 0.01)
                    return;
                send({
                    type: "look",
                    yawDelta: yawDelta * LOOKS,
                    pitchDelta: pitchDelta * LOOKS,
                });
            }

            function onOrientation(e) {
                if (
                    typeof e.alpha !== "number" ||
                    typeof e.beta !== "number" ||
                    typeof e.gamma !== "number"
                )
                    return;

                orientationEventSeen = true;
                orientationEventCount++;
                if (sensorCounts)
                    sensorCounts.textContent =
                        "M: " +
                        motionEventCount +
                        " • O: " +
                        orientationEventCount;

                const alpha = e.alpha;
                const beta = e.beta;

                if (lastOrientationAlpha === null) {
                    lastOrientationAlpha = alpha;
                    lastOrientationBeta = beta;
                    lastOrientationGamma = e.gamma;
                    return;
                }

                let dAlpha = alpha - lastOrientationAlpha;
                let dBeta = beta - lastOrientationBeta;

                if (dAlpha > 180) dAlpha -= 360;
                if (dAlpha < -180) dAlpha += 360;

                lastOrientationAlpha = alpha;
                lastOrientationBeta = beta;
                lastOrientationGamma = e.gamma;

                // Use device orientation to drive camera yaw. Phone-right should move camera-right.
                sendLook(dAlpha * 1.5, 0);
            }

            function finalizeSensorState(granted) {
                clearTimeout(enableCheckTimer);

                // Require real events before claiming enabled.
                const hasRealSignal = motionEventSeen || orientationEventSeen;

                if (hasRealSignal) {
                    setDot(sensorDot, "ok");
                    sensorTxt.textContent = "Enabled";
                    sensorSub.textContent =
                        "M:" +
                        (motionEventSeen ? "ON" : "OFF") +
                        " • O:" +
                        (orientationEventSeen ? "ON" : "OFF");
                    el("enable").textContent = "Re-enable";
                    showToast("Sensors enabled");
                } else if (granted) {
                    setDot(sensorDot, "warn");
                    sensorTxt.textContent = "Waiting";
                    sensorSub.textContent = "No stream yet";
                    showToast("No sensor stream detected", 2200);
                } else {
                    setDot(sensorDot, "bad");
                    sensorTxt.textContent = "Blocked";
                    sensorSub.textContent = "Denied/Blocked";
                    showToast("Sensors blocked", 2200);
                }
            }

            async function enableMotion() {
                let granted = false;
                let askedMotion = false;
                let askedOrientation = false;
                let promptApiMissing = false;

                motionEventSeen = false;
                orientationEventSeen = false;
                motionEventCount = 0;
                orientationEventCount = 0;
                if (sensorCounts) sensorCounts.textContent = "M: 0 • O: 0";

                // Secure-context diagnostics (MDN guidance): many sensor APIs are restricted.
                const isSecureContextLike =
                    window.isSecureContext ||
                    location.hostname === "localhost" ||
                    location.hostname === "127.0.0.1";

                if (!isSecureContextLike) {
                    setDot(sensorDot, "bad");
                    sensorTxt.textContent = "Insecure Context";
                    sensorSub.textContent = "Need HTTPS";
                }

                // iOS explicit permission requests (must be inside user gesture).
                // NOTE: iOS may NOT always show a popup:
                // - if permission was already granted previously
                // - if it was denied and persisted by browser settings
                // - if this browser context does not expose the prompt API
                try {
                    if (typeof DeviceMotionEvent !== "undefined") {
                        if (
                            typeof DeviceMotionEvent.requestPermission ===
                            "function"
                        ) {
                            askedMotion = true;
                            const r =
                                await DeviceMotionEvent.requestPermission();
                            if (r === "granted") granted = true;
                        } else {
                            promptApiMissing = true;
                        }
                    } else {
                        promptApiMissing = true;
                    }
                } catch (err) {
                    sensorSub.textContent = "Motion error";
                }

                try {
                    if (typeof DeviceOrientationEvent !== "undefined") {
                        if (
                            typeof DeviceOrientationEvent.requestPermission ===
                            "function"
                        ) {
                            askedOrientation = true;
                            const r =
                                await DeviceOrientationEvent.requestPermission();
                            if (r === "granted") granted = true;
                        } else {
                            promptApiMissing = true;
                        }
                    } else {
                        promptApiMissing = true;
                    }
                } catch (err) {
                    sensorSub.textContent = "Orientation error";
                }

                let m = false,
                    o = false;

                try {
                    window.removeEventListener("devicemotion", onMotion);
                } catch {}
                try {
                    window.removeEventListener(
                        "deviceorientation",
                        onOrientation,
                    );
                } catch {}

                try {
                    window.addEventListener("devicemotion", onMotion, {
                        passive: true,
                    });
                    m = true;
                } catch {}
                try {
                    // MDN: deviceorientation can expose `absolute` and alpha/beta/gamma.
                    // We keep one listener and handle fallbacks inside onOrientation.
                    window.addEventListener(
                        "deviceorientation",
                        onOrientation,
                        { passive: true },
                    );
                    o = true;
                } catch {}

                if (promptApiMissing && !askedMotion && !askedOrientation) {
                    setDot(sensorDot, "warn");
                    sensorTxt.textContent = "No Prompt API";
                    sensorSub.textContent = "No prompt API";
                }

                if (m || o || granted) {
                    setDot(sensorDot, "warn");
                    sensorTxt.textContent = "Checking";
                    sensorSub.textContent = "Listening...";
                    el("enable").textContent = "Re-enable";
                } else {
                    setDot(sensorDot, "bad");
                    sensorTxt.textContent = "Blocked";
                    sensorSub.textContent = "Denied/Unavailable";
                    showToast("Sensors blocked", 2200);
                    return;
                }

                enableCheckTimer = setTimeout(() => {
                    finalizeSensorState(granted);
                }, 2500);
            }

            function calibrate() {
                smoothDX = 0;
                smoothDY = 0;
                ax = 0;
                ay = 0;
                az = 0;
                lastOrientationAlpha = null;
                lastOrientationBeta = null;
                lastOrientationGamma = null;
                // Keep existing stream flags so UI remains accurate.
                send({ type: "calibrate" }); // optional; desktop may ignore
                showToast("Motion control reset");
            }

            el("reconnect").onclick = () => {
                try {
                    if (ws) ws.close();
                } catch {}
                connect();
                showToast("Reconnect requested");
            };

            el("enable").onclick = async () => {
                setDot(sensorDot, "warn");
                sensorTxt.textContent = "Requesting";
                sensorSub.textContent = "Requesting...";
                await enableMotion();
            };
            el("start").onclick = () => {
                send({ type: "start" });
                showToast("Start Game sent");
            };
            el("reload").onclick = () => {
                send({ type: "reload" });
                showToast("Reload sent");
            };
            el("cal").onclick = calibrate;

            fire.addEventListener(
                "touchstart",
                (e) => {
                    e.preventDefault();

                    // Auto-attempt sensor enable on first FIRE touch so users don't
                    // need a separate step before motion starts working.
                    if (!motionEventSeen && !orientationEventSeen) {
                        setDot(sensorDot, "warn");
                        sensorTxt.textContent = "Requesting";
                        sensorSub.textContent = "Requesting...";
                        enableMotion();
                    }

                    fireNow(false);
                },
                { passive: false },
            );
            fire.addEventListener("mousedown", (e) => {
                e.preventDefault();
                fireNow(false);
            });

            renderAmmo(10, 10);
            connect();
            setInterval(() => send({ type: "ping", t: Date.now() }), 12000);
        </script>
    </body>
</html>
